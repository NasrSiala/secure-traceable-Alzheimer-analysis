repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff — lint Python
        entry: uv run --locked ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff — format Python
        entry: uv run --locked ruff format
        language: system
        types: [python]
      - id: mypy
        name: Mypy — typage du backend
        entry: uv run --locked mypy saam
        language: system
        pass_filenames: false
        always_run: true
