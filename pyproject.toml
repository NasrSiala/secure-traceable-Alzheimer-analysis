[project]
name = "saamstiahf"
version = "0.1.0"
description = "Prototype pédagogique de traçabilité des analyses ECG"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "cryptography>=44,<47",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "numpy>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pyjwt>=2.10,<3",
    "rfc8785>=0.1.4,<0.2",
    "slowapi>=0.1.9,<1",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "cocotb==2.0.1",
    "import-linter>=2.2,<3",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff==0.17.3",
]

[tool.uv]
# Monorepo exécuté depuis sa racine ; aucun paquet à publier.
package = false

[tool.importlinter]
root_packages = ["saam"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Points d'entrée, domaines et bibliothèques (Architecture §6)"
type = "layers"
containers = ["saam"]
layers = [
    "api : pipeline",
    "identity : cases : registry : traceability : verification : audit",
    "hashing | dsp | ledger | storage",
]
exhaustive = true

[[tool.importlinter.contracts]]
id = "api-pipeline"
name = "L'API ne lance pas le pipeline"
type = "forbidden"
source_modules = ["saam.api"]
forbidden_modules = ["saam.pipeline"]
# §8 autorise seulement l'interface de lecture des journaux, à venir avec T3.5.
ignore_imports = ["saam.api.** -> saam.pipeline.logs"]
unmatched_ignore_imports_alerting = "none"

[[tool.importlinter.contracts]]
id = "hardware-isolation"
name = "Backend sans carte ni SDK Fabric direct (ADR-16)"
type = "forbidden"
source_modules = ["saam"]
forbidden_modules = ["hw", "serial", "pyserial", "hfc", "grpc", "fabric_sdk_py"]

[tool.ruff]
target-version = "py311"
# Format déjà utilisé par les contributions de main.
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["saam.hashing", "saam.hashing.*", "saam.storage", "saam.storage.*"]
strict = true
