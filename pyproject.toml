[project]
name = "saamstiahf"
version = "0.1.0"
description = "Prototype pédagogique de traçabilité des analyses ECG"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff==0.17.3",
]

[tool.uv]
# Monorepo exécuté depuis sa racine ; aucun paquet à publier.
package = false

[tool.ruff]
target-version = "py311"
# Format déjà utilisé par les contributions de main.
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["saam.hashing", "saam.hashing.*", "saam.storage", "saam.storage.*"]
strict = true
