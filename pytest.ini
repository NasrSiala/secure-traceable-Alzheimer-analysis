[pytest]
testpaths = tests
pythonpath = .
markers =
    stack: tests that require the already-running T1.5 stack; enable explicitly with SAAM_TEST_STACK=1.
    fabric: tests that require the local Hyperledger Fabric test network and Docker. Run them with scripts/test-l.sh --fabric.
    board: tests that require the Zybo Z7-10 board. Run them with scripts/test-l.sh --board. They are not part of the default suite.
addopts = -m "not fabric and not board"
