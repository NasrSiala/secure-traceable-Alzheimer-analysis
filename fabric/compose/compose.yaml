# Isolated Fabric 2.5 test network for SAAMSTIAHF.
# Project name, container names, volume names, and the Docker network are
# prefixed with saam-medtrace so this file cannot remove another network.
# Chaincode runs as an external service (chaincode as a service, profile "spike"), so the
# Docker socket is intentionally not mounted. Every service, one-off ones included,
# carries the label saam.network=medtrace: `network.sh stop` removes only labeled resources.
# Published ports are bound to 127.0.0.1: host tooling is local, the network is not offered to the LAN.

name: saam-medtrace

networks:
  saam-medtrace:
    name: saam-medtrace
    labels:
      saam.network: medtrace

volumes:
  orderer-ledger:
    name: saam-medtrace-orderer-ledger
    labels:
      saam.network: medtrace
  peer0-org1-ledger:
    name: saam-medtrace-peer0-org1-ledger
    labels:
      saam.network: medtrace
  peer0-org2-ledger:
    name: saam-medtrace-peer0-org2-ledger
    labels:
      saam.network: medtrace

services:
  ca-org1:
    image: hyperledger/fabric-ca:1.5.17
    container_name: saam-medtrace-ca-org1
    hostname: ca-org1
    labels:
      saam.network: medtrace
      saam.role: ca
      saam.org: org1
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-org1
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_CA_SERVER_CSR_HOSTS: ca-org1,localhost,saam-medtrace-ca-org1
      CA_BOOTSTRAP_USER: ${CA_ORG1_USER:-}
      CA_BOOTSTRAP_PASSWORD: ${CA_ORG1_PASSWORD:-}
    ports:
      - "127.0.0.1:18054:7054"
    volumes:
      - ../organizations/fabric-ca/org1:/etc/hyperledger/fabric-ca-server
      - ../scripts/start-ca.sh:/start-ca.sh:ro
    entrypoint: ["/bin/sh", "/start-ca.sh"]
    networks:
      saam-medtrace: {}
    restart: "no"

  ca-org2:
    image: hyperledger/fabric-ca:1.5.17
    container_name: saam-medtrace-ca-org2
    hostname: ca-org2
    labels:
      saam.network: medtrace
      saam.role: ca
      saam.org: org2
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-org2
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_CA_SERVER_CSR_HOSTS: ca-org2,localhost,saam-medtrace-ca-org2
      CA_BOOTSTRAP_USER: ${CA_ORG2_USER:-}
      CA_BOOTSTRAP_PASSWORD: ${CA_ORG2_PASSWORD:-}
    ports:
      - "127.0.0.1:18055:7054"
    volumes:
      - ../organizations/fabric-ca/org2:/etc/hyperledger/fabric-ca-server
      - ../scripts/start-ca.sh:/start-ca.sh:ro
    entrypoint: ["/bin/sh", "/start-ca.sh"]
    networks:
      saam-medtrace: {}
    restart: "no"

  ca-orderer:
    image: hyperledger/fabric-ca:1.5.17
    container_name: saam-medtrace-ca-orderer
    hostname: ca-orderer
    labels:
      saam.network: medtrace
      saam.role: ca
      saam.org: orderer
    environment:
      FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
      FABRIC_CA_SERVER_CA_NAME: ca-orderer
      FABRIC_CA_SERVER_TLS_ENABLED: "true"
      FABRIC_CA_SERVER_PORT: "7054"
      FABRIC_CA_SERVER_CSR_HOSTS: ca-orderer,localhost,saam-medtrace-ca-orderer
      CA_BOOTSTRAP_USER: ${CA_ORDERER_USER:-}
      CA_BOOTSTRAP_PASSWORD: ${CA_ORDERER_PASSWORD:-}
    ports:
      - "127.0.0.1:18056:7054"
    volumes:
      - ../organizations/fabric-ca/ordererOrg:/etc/hyperledger/fabric-ca-server
      - ../scripts/start-ca.sh:/start-ca.sh:ro
    entrypoint: ["/bin/sh", "/start-ca.sh"]
    networks:
      saam-medtrace: {}
    restart: "no"

  orderer:
    image: hyperledger/fabric-orderer:2.5.16
    container_name: saam-medtrace-orderer
    hostname: orderer.example.com
    labels:
      saam.network: medtrace
      saam.role: orderer
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: "7050"
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
      ORDERER_GENERAL_TLS_ENABLED: "true"
      ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
      ORDERER_ADMIN_TLS_ENABLED: "true"
      ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_OPERATIONS_LISTENADDRESS: orderer.example.com:9443
      ORDERER_METRICS_PROVIDER: prometheus
    command: orderer
    volumes:
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
      - orderer-ledger:/var/hyperledger/production/orderer
    ports:
      - "127.0.0.1:18050:7050"
      - "127.0.0.1:18053:7053"
    networks:
      saam-medtrace:
        aliases:
          - orderer.example.com
    restart: "no"

  peer0-org1:
    image: hyperledger/fabric-peer:2.5.16
    container_name: saam-medtrace-peer0-org1
    hostname: peer0.org1.example.com
    labels:
      saam.network: medtrace
      saam.role: peer
      saam.org: org1
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/peercfg
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_PEER_ID: peer0.org1.example.com
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.example.com:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_STATEDATABASE: goleveldb
      CORE_LEDGER_HISTORY_ENABLEHISTORYDATABASE: 'true'
      CORE_OPERATIONS_LISTENADDRESS: peer0.org1.example.com:9444
      CORE_METRICS_PROVIDER: prometheus
    command: peer node start
    volumes:
      - ../organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com:/etc/hyperledger/fabric
      - ../.runtime/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - peer0-org1-ledger:/var/hyperledger/production
    ports:
      - "127.0.0.1:18051:7051"
    networks:
      saam-medtrace:
        aliases:
          - peer0.org1.example.com
    restart: "no"

  peer0-org2:
    image: hyperledger/fabric-peer:2.5.16
    container_name: saam-medtrace-peer0-org2
    hostname: peer0.org2.example.com
    labels:
      saam.network: medtrace
      saam.role: peer
      saam.org: org2
    environment:
      FABRIC_CFG_PATH: /etc/hyperledger/peercfg
      FABRIC_LOGGING_SPEC: INFO
      CORE_PEER_TLS_ENABLED: "true"
      CORE_PEER_PROFILE_ENABLED: "false"
      CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
      CORE_PEER_ID: peer0.org2.example.com
      CORE_PEER_ADDRESS: peer0.org2.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org2.example.com:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org2.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org2.example.com:7051
      CORE_PEER_LOCALMSPID: Org2MSP
      CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
      CORE_LEDGER_STATE_STATEDATABASE: goleveldb
      CORE_LEDGER_HISTORY_ENABLEHISTORYDATABASE: 'true'
      CORE_OPERATIONS_LISTENADDRESS: peer0.org2.example.com:9445
      CORE_METRICS_PROVIDER: prometheus
    command: peer node start
    volumes:
      - ../organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com:/etc/hyperledger/fabric
      - ../.runtime/core.yaml:/etc/hyperledger/peercfg/core.yaml:ro
      - peer0-org2-ledger:/var/hyperledger/production
    ports:
      - "127.0.0.1:18052:7051"
    networks:
      saam-medtrace:
        aliases:
          - peer0.org2.example.com
    restart: "no"

  ca-client:
    image: hyperledger/fabric-ca:1.5.17
    profiles: ["tools"]
    labels:
      saam.network: medtrace
      saam.role: ca-client
    working_dir: /work
    entrypoint: ["bash"]
    volumes:
      - ../organizations:/work/organizations
      - ../scripts:/work/scripts:ro
      - ../.runtime:/work/runtime:ro
      - ../wallet:/work/wallet
    networks:
      saam-medtrace: {}
    restart: "no"

  tools:
    image: hyperledger/fabric-tools:2.5.16
    profiles: ["tools"]
    labels:
      saam.network: medtrace
      saam.role: tools
    working_dir: /work
    environment:
      FABRIC_CFG_PATH: /work/config
    entrypoint: ["bash"]
    volumes:
      - ../organizations:/work/organizations
      - ../channel-artifacts:/work/channel-artifacts
      - ../config:/work/config:ro
      - ../scripts:/work/scripts:ro
      - ../.runtime:/work/runtime:ro
    networks:
      saam-medtrace: {}
    restart: "no"

  # Deletes the generated directories. Containers run as root, so on Linux (Docker Engine)
  # they leave root-owned files in the bind mounts that the host user cannot remove.
  # No project network: running it must not recreate the network `stop` has just removed.
  cleaner:
    image: hyperledger/fabric-tools:2.5.16
    profiles: ["tools"]
    labels:
      saam.network: medtrace
      saam.role: cleaner
    working_dir: /work
    entrypoint: ["sh"]
    volumes:
      - ..:/work/fabric
    network_mode: none
    restart: "no"

  cc-build:
    image: node:20.20.2-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    profiles: ["spike"]
    labels:
      saam.network: medtrace
      saam.role: cc-build
    working_dir: /src
    volumes:
      - ../../chaincode/provenance:/src
    entrypoint: ["bash"]
    networks:
      saam-medtrace: {}
    restart: "no"

  gw-build:
    image: node:20.20.2-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    profiles: ["spike"]
    labels:
      saam.network: medtrace
      saam.role: gw-build
    working_dir: /gw
    volumes:
      - ../../ledger-gateway:/gw
    entrypoint: ["bash"]
    networks:
      saam-medtrace: {}
    restart: "no"

  cc-org1:
    image: node:20.20.2-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    profiles: ["spike"]
    container_name: saam-medtrace-cc-org1
    hostname: saam-medtrace-cc-org1
    labels:
      saam.network: medtrace
      saam.role: chaincode
      saam.org: org1
    working_dir: /src
    environment:
      CHAINCODE_ID: ${CHAINCODE_ID_ORG1:-pending}
    volumes:
      - ../../chaincode/provenance:/src:ro
    entrypoint: ["node", "node_modules/fabric-shim/cli.js"]
    command:
      - server
      - --chaincode-address
      - 0.0.0.0:9999
      - --chaincode-id
      - ${CHAINCODE_ID_ORG1:-pending}
    networks:
      saam-medtrace: {}
    restart: "no"

  cc-org2:
    image: node:20.20.2-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    profiles: ["spike"]
    container_name: saam-medtrace-cc-org2
    hostname: saam-medtrace-cc-org2
    labels:
      saam.network: medtrace
      saam.role: chaincode
      saam.org: org2
    working_dir: /src
    environment:
      CHAINCODE_ID: ${CHAINCODE_ID_ORG2:-pending}
    volumes:
      - ../../chaincode/provenance:/src:ro
    entrypoint: ["node", "node_modules/fabric-shim/cli.js"]
    command:
      - server
      - --chaincode-address
      - 0.0.0.0:9999
      - --chaincode-id
      - ${CHAINCODE_ID_ORG2:-pending}
    networks:
      saam-medtrace: {}
    restart: "no"

  spike:
    image: node:20.20.2-bookworm@sha256:8f693eaa7e0a8e71560c9a82b55fd54c2ae920a2ba5d2cde28bac7d1c01c9ba5
    profiles: ["spike"]
    labels:
      saam.network: medtrace
      saam.role: spike
    working_dir: /gw
    volumes:
      - ../../ledger-gateway:/gw
      - ../wallet:/wallet:ro
    environment:
      WALLET_DIR: /wallet
      PEER_ENDPOINT: peer0.org1.example.com:7051
      PEER_TLS_CERT: /wallet/peer0-org1-tls-ca.crt
      CHANNEL_NAME: medtrace
      CHAINCODE_NAME: provenance
    entrypoint: ["npm", "run", "spike:submit"]
    networks:
      saam-medtrace: {}
    restart: "no"
